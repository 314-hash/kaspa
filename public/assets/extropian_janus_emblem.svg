<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagon -->
  <polygon points="100,15 175,58 175,142 100,185 25,142 25,58"
           fill="none"
           stroke="url(#neonCyanPurple)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#glow)" />

  <!-- Inner Hexagon Accent -->
  <polygon points="100,28 162,64 162,136 100,172 38,136 38,64"
           fill="none"
           stroke="rgba(56, 189, 248, 0.25)"
           stroke-width="1.5" />

  <!-- Left Glyph: E (Extropian) -->
  <path d="M 82 62 L 60 75 L 60 125 L 82 138 M 60 100 L 80 100"
        fill="none"
        stroke="#00f2fe"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Right Glyph: J (Janus) -->
  <path d="M 118 62 L 140 75 L 140 125 L 118 138 M 140 100 L 120 100"
        fill="none"
        stroke="#c084fc"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Central Fusion Core -->
  <circle cx="100" cy="100" r="4" fill="#ffffff" filter="url(#glow)" />
</svg>
